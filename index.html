<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Memory Game</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; }
        #score { margin-bottom: 20px; font-size: 1.2rem; color: #888; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            gap: 15px;
        }
        .tile {
            height: 150px;
            border-radius: 15px;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.1s, transform 0.1s;
        }
        .tile:active { transform: scale(0.95); }
        .active { opacity: 1.0; box-shadow: 0 0 20px #fff; }
        #red { background-color: #ff4757; }
        #blue { background-color: #2ed573; }
        #green { background-color: #1e90ff; }
        #yellow { background-color: #ffa502; }
        #start-btn {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            font-family: monospace;
            background: #ffffff;
            color: #121212;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #start-btn:hover { background: #ddd; }
    </style>
</head>
<body>

    <h1>COLOR MEMORY</h1>
    <div id="score">Score: 0</div>

    <div class="grid">
        <div class="tile" id="red" data-color="red"></div>
        <div class="tile" id="blue" data-color="blue"></div>
        <div class="tile" id="green" data-color="green"></div>
        <div class="tile" id="yellow" data-color="yellow"></div>
    </div>

    <button id="start-btn" onclick="startGame()">Start Game</button>

    <script>
        const tiles = ['red', 'blue', 'green', 'yellow'];
        let sequence = [];
        let playerSequence = [];
        let score = 0;
        let isPlaying = false;

        function startGame() {
            sequence = [];
            playerSequence = [];
            score = 0;
            document.getElementById('score').innerText = `Score: ${score}`;
            document.getElementById('start-btn').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            playerSequence = [];
            score++;
            document.getElementById('score').innerText = `Score: ${score - 1}`;
            const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
            sequence.push(randomTile);
            playSequence();
        }

        function playSequence() {
            isPlaying = false;
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    isPlaying = true;
                    return;
                }
                flashTile(sequence[i]);
                i++;
            }, 600);
        }

        function flashTile(color) {
            const tile = document.getElementById(color);
            tile.classList.add('active');
            setTimeout(() => {
                tile.classList.remove('active');
            }, 300);
        }

        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('click', (e) => {
                if (!isPlaying) return;
                const color = e.target.dataset.color;
                playerSequence.push(color);
                flashTile(color);

                const currentIndex = playerSequence.length - 1;
                if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                    alert(`Game Over! Final Score: ${score - 1}`);
                    document.getElementById('start-btn').style.display = 'block';
                    isPlaying = false;
                    return;
                }

                if (playerSequence.length === sequence.length) {
                    isPlaying = false;
                    setTimeout(nextRound, 1000);
                }
            });
        });
    </script>
</body>
